
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeatHai - Bus & Train Reservation</title>
  <link rel="stylesheet" href="web.css">
</head>
<body class="dark-theme">

  <div class="app-container">
    <!-- Header -->
    <header class="navbar">
      <h1 class="logo">Seat<span>Hai</span></h1>
      <button id="theme-toggle" class="btn-theme">☀️/🌙</button>
    </header>

    <!-- Search / Route Card -->
    <section class="card booking-card">
      <h2>New Booking</h2>
      <div class="vehicle-toggle">
        <button class="btn-toggle active">🚆 Train</button>
        <button class="btn-toggle">🚌 Bus</button>
      </div>

      <div class="input-group">
        <label>From:</label>
        <input type="text" value="" placeholder="Enter Source">
      </div>

      <div class="input-group">
        <label>To:</label>
        <input type="text" value="" placeholder="Enter Destination">
      </div>

      <button class="btn-primary">Find My Seat</button>
    </section>

    <!-- 2D Vertical Seat Selection Layout -->
    <section class="card seat-card">
      <h3>Select Seat (Rajdhani Express)</h3>
      
      <div class="seat-legend">
        <span class="legend-item"><span class="box available"></span> Available</span>
        <span class="legend-item"><span class="box occupied"></span> Occupied</span>
      </div>

      <div class="seat-grid-2d">
        <!-- Row 1 -->
        <div class="seat-row">
          <button class="seat available">A1</button>
          <button class="seat available">B1</button>

          <span class="aisle"></span>

          <button class="seat occupied">B1</button>
          <button class="seat available">A1</button>
        </div>
        <!-- Row 2 -->
        <div class="seat-row">
          <button class="seat available">A2</button>
          <button class="seat available">B2</button>

          <span class="aisle"></span>

          <button class="seat occupied">B2</button>
          <button class="seat available">A2</button>
        </div>
        <!-- Row 3 -->
        <div class="seat-row">
          <button class="seat available">A3</button>
          <button class="seat available">B3</button>

          <span class="aisle"></span>

          <button class="seat occupied">B3</button>
          <button class="seat available">A3</button>
        </div>
        <!-- Row 4 -->
        <div class="seat-row">
          <button class="seat available">A4</button>
          <button class="seat selected">4A</button>

          <span class="aisle"></span>

          <button class="seat available">B4</button>
          <button class="seat available">A4</button>
        </div>
      </div>

      <button class="btn-primary gold-slide">Slide to Pay ➔</button>
    </section>
  </div>

  <script>
    // Theme Switcher Logic
    const toggleBtn = document.getElementById('theme-toggle');
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-theme');
      document.body.classList.toggle('dark-theme');
    });
  </script>
</body>
</html>
